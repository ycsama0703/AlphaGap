# =========================================================================
# 数据源配置
# =========================================================================
sources:
  ai:
    primary:
      - huggingface_daily        # https://huggingface.co/papers
    supplementary:
      - arxiv:cs.LG
      - arxiv:cs.CL
      - arxiv:cs.AI
      - arxiv:cs.MA              # multi-agent
    frequency: daily

  fin:
    primary:
      - arxiv:q-fin.PM           # portfolio management
      - arxiv:q-fin.ST           # statistical finance
      - arxiv:q-fin.TR           # trading & market microstructure
      - arxiv:q-fin.CP           # computational finance
    supplementary:
      - ssrn_fen                 # Financial Economics Network, weekly digest
      - semantic_scholar_search  # 关键词搜补漏
    frequency: daily_arxiv_weekly_ssrn

  enrichment:
    - semantic_scholar           # 作者 h-index, citations, affiliations
    - openalex                   # 机构 ROR ID 标准化
