# AI × Fin Research Radar — Author/Institution Whitelist (v0.1 draft)
#
# 用法：
# - 论文进入候选池的条件 = 以下任一为真（OR 逻辑）：
#     1) 任一作者机构匹配 institutions.* 中任意条目
#     2) 任一作者 h-index ≥ thresholds.h_index_{ai|fin}
#     3) 论文有外部背书（HF Daily / arXiv 热度 / 高 altmetric）
#     4) 关键词强命中 + 摘要相关性高（LLM 打分 ≥ 阈值）
# - 满足 ≥2 条 → 优先级提升（push 到 daily digest 顶部）
# - 字符串匹配时建议小写化 + 去标点 + 子串匹配（"google research" 命中 "Google Research LLC"）

thresholds:
  h_index_ai: 15        # AI 侧个人 h-index 阈值（新人多，放低）
  h_index_fin: 20       # Fin 侧个人 h-index 阈值（资历更重要）
  llm_relevance: 0.7    # LLM 摘要相关性打分阈值（0-1）

