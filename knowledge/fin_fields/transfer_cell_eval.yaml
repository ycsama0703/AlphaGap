version: 1
status: initial_curated_requires_owner_signoff
created_at: 2026-05-26
purpose: >-
  Acceptance set for the Fin-first AI evidence auditor. Cases are selected
  from the local AI evidence corpus to cover direct transfer, adjacent
  interventions that require taxonomy review, and attractive but invalid
  analogies. Running this asset must not write evidence links.
label_policy:
  support: >-
    The paper contributes the same intervention operation as an active
    transfer cell and can be evaluated through that cell's experiment anchor.
  candidate_extension: >-
    The intervention is technically concrete and plausibly useful to a
    maintained finance field, but is not the same operation as an active cell.
  reject: >-
    The paper is a benchmark only, a domain-specific method without a usable
    finance intervention, or an analogy that should not enter gap generation.
cases:
  - paper_id: openreview:4FWAwZtd2n
    title: Scaling LLM Test-Time Compute Optimally Can be More Effective than Scaling Parameters for Reasoning
    expected_verdict: support
    expected_cell_id: factor.budgeted_search
    difficulty: clear_support
    rationale: Adaptive test-time allocation is a direct compute-budget policy for fixed-budget hypothesis search.
  - paper_id: openreview:FSjIrOm1vz
    title: Inference Scaling for Long-Context Retrieval Augmented Generation
    expected_verdict: support
    expected_cell_id: agent.adaptive_retrieval_budget
    difficulty: clear_support
    rationale: It allocates retrieval and generation depth under budget for evidence questions.
